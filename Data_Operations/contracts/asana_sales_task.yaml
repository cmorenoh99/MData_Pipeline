# Contrato de datos - Fuente: Asana, proyecto Sales
# Tabla destino: asana_sales_task
# TFM - Framework de observabilidad y validacion de integridad de datos
# Autor: Camila Moreno Higuita

source:
  name: asana_sales_task
  type: api
  description: Tareas del proyecto Sales en Asana

identifier:
  field: gid
  type: int

schema:
  gid: int
  resource_subtype: string
  name: string
  project_id: int
  project_name: string
  section_id: int
  section_name: string
  created_at: timestamp
  assigne_id: int
  assigne_name: string
  assigne_email: string
  id: string
  restaurant: string
  country: string
  date_sale: string   # nota: aun no se tipa como fecha en el script de extraccion
  lost_reason: string
  completed: bool
  completed_at: timestamp
  actual_time_minutes: int
  modified_at: timestamp
  permalink_url: string

completeness:
  threshold_percent: 5
  critical_fields:
    - name
    - project_id
    - restaurant
    - id
    - country
  # No incluidos como criticos, por ser nulos legitimos segun el negocio:
  # lost_reason (solo aplica si la tarea se perdio)
  # assigne_id / assigne_name / assigne_email (tarea puede estar sin asignar)
  # completed_at (solo aplica si la tarea esta completada)

volumetry:
  window_days: 7
  z_score_threshold: 2.5

project_integrity:
  expected_project_id: "1216713295378538" 
  expected_project_name: "Sales"

health_score:
  weights:
    uniqueness: 0.20
    completeness: 0.30
    schema_consistency: 0.20
    project_integrity: 0.15
    volumetry: 0.15