# Contrato de datos - Fuente: Asana, proyecto Operaciones
# Tabla destino: asana_operations_task
# TFM - Framework de observabilidad y validacion de integridad de datos
# Autor: Camila Moreno Higuita

source:
  name: asana_operations_task
  type: api
  description: Tareas del proyecto Operaciones en Asana

identifier:
  field: gid
  type: int

schema:
  gid: int
  resource_subtype: string
  name: string
  project_id: int
  project_name: string
  section_id: int
  section_name: string
  created_at: timestamp
  assigne_id: int
  assigne_name: string
  assigne_email: string
  id: string
  restaurant: string
  priority: string
  type: string
  lost_reason: string
  completed: bool
  completed_at: timestamp
  actual_time_minutes: int
  modified_at: timestamp
  permalink_url: string

completeness:
  threshold_percent: 
  critical_fields:
    - name
    - project_id
    - restaurant
    - id
    - type
  # No incluidos como criticos, por ser nulos legitimos segun el negocio:
  # lost_reason (solo aplica si la tarea se perdio)
  # assigne_id / assigne_name / assigne_email (tarea puede estar sin asignar)
  # completed_at (solo aplica si la tarea esta completada)

volumetry:
  window_days: 7
  z_score_threshold: 2.5

project_integrity:
  expected_project_id: "1216685996541408"   # reemplazar con el gid real
  expected_project_name: "Operaciones"